name: Node.js Test

on:
  push:
    branches: [ "main", "gelistirme-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run tests
      run: npm test
